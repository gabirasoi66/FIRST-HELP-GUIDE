<script>
const KEY='fhg-v12';let st={screen:'home',cases:[],active:null,reminders:[]};try{Object.assign(st,JSON.parse(localStorage.getItem(KEY))||{}, {screen:'home'})}catch(e){}
const $=x=>document.getElementById(x),save=()=>{try{const payload=JSON.stringify({...st,screen:'home'});localStorage.setItem(KEY,payload);if(localStorage.getItem(KEY)!==payload)throw Error('Verificarea salvării a eșuat');return true}catch(e){alert('Salvarea NU a fost confirmată. Datele existente nu trebuie șterse. Exportă un backup și verifică spațiul disponibil. Detalii: '+e.message);return false}},cur=()=>st.cases.find(x=>x.id===st.active);
if(!st.cases.length){for(const key of ['fhg-v11','fhg-v10','fhg-v09','fhg-v08','fhg-v07']){try{let old=JSON.parse(localStorage.getItem(key)||'null');if(old&&Array.isArray(old.cases)&&old.cases.length){st.cases=old.cases;st.active=old.active;st.reminders=old.reminders||[];save();break}}catch(e){}}}
function casePhotos(c){return [...(c.photo?[c.photo]:[]),...(Array.isArray(c.photos)?c.photos:[])];}
function validPhoto(v){return typeof v==='string'&&v.length<=3*1024*1024&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v);}
function validatePhotos(c){if(c.photo!==undefined&&!validPhoto(c.photo))throw Error('Fotografie invalidă');if(c.photos!==undefined&&(!Array.isArray(c.photos)||c.photos.length>8||c.photos.some(p=>!validPhoto(p))))throw Error('Galerie invalidă');}
function photoTotal(cases){return cases.reduce((n,c)=>n+casePhotos(c).length,0)}
function exportCases(){const obj={format:'FIRST_HELP_GUIDE_BACKUP',version:3,includesPhotos:true,exported:new Date().toISOString(),cases:st.cases,reminders:st.reminders};const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FIRST_HELP_GUIDE_backup_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* V1.11: read-only backup restoration rehearsal; never writes to localStorage. */
function verifyBackupReadOnly(file){
 if(!file)return;
 const panel=$('restoreCheckResult');if(!panel)return;
 panel.replaceChildren();
 const info=document.createElement('p');info.className='muted';info.textContent='Se verifică fișierul local…';panel.append(info);
 if(file.size>30*1024*1024){info.textContent='Fișier prea mare (maxim 30 MB).';return;}
 const reader=new FileReader();
 reader.onerror=()=>{info.textContent='Nu s-a putut citi fișierul.'};
 reader.onload=()=>{
  let data;
  try{
   data=JSON.parse(reader.result);
   if(data.format!=='FIRST_HELP_GUIDE_BACKUP'||!Array.isArray(data.cases)||data.cases.length>1000)throw Error('Format backup invalid');
   const ids=new Set();
   for(const c of data.cases){
    if(!c||typeof c.id!=='string'||typeof c.title!=='string'||ids.has(c.id))throw Error('Caz invalid sau ID duplicat');
    ids.add(c.id);
    validatePhotos(c);
   }
  }catch(e){info.textContent='Verificare nereușită: '+e.message;return;}
  const photos=data.cases.flatMap(c=>casePhotos(c).map(photo=>({title:c.title,photo})));
  info.textContent='Backup citit: '+data.cases.length+' cazuri, '+photos.length+' fotografii. Se verifică fiecare imagine. Datele existente NU au fost modificate.';
  let checked=0,failed=0;const finish=(ok)=>{checked++;if(!ok)failed++;if(checked===photos.length){info.textContent=failed?'ATENȚIE: '+failed+' din '+photos.length+' fotografii nu au putut fi decodate. Nu utiliza acest backup pentru migrare.':'VERIFICARE COMPLETĂ: '+data.cases.length+' cazuri, '+photos.length+' fotografii decodate corect. Datele existente NU au fost modificate.';}};
  if(!photos.length){const p=document.createElement('p');p.textContent='Nu există fotografii în acest backup.';panel.append(p);return;}
  const label=document.createElement('p');label.textContent='Test de restaurare a fotografiilor din JSON:';panel.append(label);
  photos.forEach((c,i)=>{
   const card=document.createElement('div');card.className='card';
   const name=document.createElement('b');name.textContent='Fotografia '+(i+1)+' — '+c.title;card.append(name);
   const status=document.createElement('p');status.className='muted';status.textContent='Se verifică decodarea imaginii…';card.append(status);
   const img=new Image();img.alt='Fotografie din backup';img.style.cssText='display:none;width:100%;max-height:280px;object-fit:contain;border-radius:12px;margin-top:10px';
   img.onload=()=>{const ok=!!(img.naturalWidth&&img.naturalHeight);status.textContent=ok?'Fotografie decodată cu succes ('+img.naturalWidth+' × '+img.naturalHeight+').':'EROARE: dimensiuni imagine invalide.';if(ok)img.style.display='block';finish(ok)};
   img.onerror=()=>{status.textContent='EROARE: fotografia nu poate fi decodată.';finish(false)};
   card.append(img);panel.append(card);img.src=c.photo;
  });
 };
 reader.readAsText(file);
}
/* V1.18: validate the entire file before offering a non-destructive merge. */
function importCases(file){
 if(!file)return;
 if(file.size>30*1024*1024){alert('Backup prea mare (maximum 30 MB).');return;}
 const reader=new FileReader();
 reader.onerror=()=>alert('Fișierul nu a putut fi citit. Nu s-a modificat nimic.');
 reader.onload=async()=>{
  let d;
  try{
   d=JSON.parse(reader.result);
   if(d.format!=='FIRST_HELP_GUIDE_BACKUP'||!Array.isArray(d.cases)||d.cases.length>1000||!Array.isArray(d.reminders||[]))throw Error('Format invalid');
   const ids=new Set();
   for(const c of d.cases){
    if(!c||typeof c.id!=='string'||!c.id||c.id.length>150||ids.has(c.id)||typeof c.title!=='string'||c.title.length>1000)throw Error('Caz invalid sau ID duplicat în fișier');
    ids.add(c.id);
    validatePhotos(c);
   }
   for(const r of d.reminders){if(!r||typeof r.text!=='string'||typeof r.date!=='string'||r.text.length>1000||r.date.length>100)throw Error('Memento invalid');}
   const photos=d.cases.flatMap(c=>casePhotos(c).map(photo=>({title:c.title,photo})));
   for(const c of photos){
    await new Promise((resolve,reject)=>{
     const img=new Image();img.onload=()=>{if(img.naturalWidth&&img.naturalHeight)resolve();else reject(Error('Fotografie deteriorată'))};
     img.onerror=()=>reject(Error('Fotografia din cazul „'+c.title.slice(0,60)+'” nu poate fi decodată'));
     img.src=c.photo;
    });
   }
  }catch(e){alert('Import oprit: '+e.message+'\nDatele existente nu au fost modificate.');return;}
  const currentIds=new Set(st.cases.map(c=>c.id));
  const fresh=d.cases.filter(c=>!currentIds.has(c.id));
  const duplicates=d.cases.length-fresh.length;
  const existing=st.cases.length;
  const knownReminders=new Set(st.reminders.map(r=>JSON.stringify([r.text,r.date])));
  const newReminders=d.reminders.filter(r=>{const key=JSON.stringify([r.text,r.date]);if(knownReminders.has(key))return false;knownReminders.add(key);return true;});
  const message='V1.22 — verificare completă a backupului\n\nCazuri în fișier: '+d.cases.length+'\nCazuri existente: '+existing+'\nCazuri noi: '+fresh.length+'\nID-uri existente, păstrate nemodificate: '+duplicates+'\nFotografii verificate: '+photoTotal(d.cases)+'\nMementouri noi: '+newReminders.length+'\n\nOK = adaugă numai datele noi.\nAnulează = nu modifica nimic.';
  if(!confirm(message))return;
  const previousCases=st.cases,previousReminders=st.reminders;
  // Nu elimina cazurile existente; importul este exclusiv aditiv.
  st.cases=[...previousCases,...fresh];
  st.reminders=[...previousReminders,...newReminders.map(r=>({text:r.text,date:r.date}))];
  if(!save()){
   st.cases=previousCases;st.reminders=previousReminders;
   alert('Import anulat: spațiu insuficient. Datele din memorie au fost restabilite.');return;
  }
  go('history');
  alert('Import finalizat: '+fresh.length+' cazuri noi, '+newReminders.length+' mementouri noi. '+duplicates+' cazuri existente au fost păstrate fără suprascriere.');
 };
 reader.readAsText(file);
}

let speechSession=null;
function speechInput(){
 const API=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!API){alert('Recunoașterea vocală nu este disponibilă în acest browser sau pentru acest fișier local. Poți introduce problema prin tastare.');return;}
 if(speechSession){try{speechSession.stop()}catch(e){} speechSession=null;return}
 const r=new API();speechSession=r;r.lang='ro-RO';r.interimResults=false;r.maxAlternatives=1;
 const q=$('q');
 if(!q){speechSession=null;return}
 q.placeholder='Ascult... vorbește acum';
 r.onresult=e=>{const v=e.results?.[0]?.[0]?.transcript||'';q.value=(q.value.trim()?q.value.trim()+' ':'')+v;q.focus()};
 r.onerror=e=>{q.placeholder='Spune, scrie sau arată problema...';alert('Microfon: '+e.error+'. Poți continua prin tastare.')};
 r.onend=()=>{speechSession=null;if($('q'))$('q').placeholder='Spune, scrie sau arată problema...'};
 try{r.start()}catch(e){speechSession=null;alert('Microfonul nu a putut porni: '+e.message)}
}

}
function photoSelected(file){
 if(!file)return;
 if(!file.type.startsWith('image/')){alert('Selectează o imagine.');return}
 if(file.size>8*1024*1024){alert('Fotografia depășește 8 MB. Alege o imagine mai mică.');return}
 const r=new FileReader();
 r.onload=()=>{
  const v=$('photoPreview');
  if(v){v.innerHTML='<div class="card"><b>Fotografie selectată (previzualizare locală)</b><img alt="Fotografia problemei" style="display:block;max-width:100%;max-height:280px;object-fit:contain;margin-top:10px;border-radius:12px" src="'+r.result+'"><p class="muted">Fotografia nu este analizată de AI. După salvarea în caz, fotografia este inclusă în exportul JSON. Poți descrie problema în câmpul de text.</p><button class="action alt" id="clearPhoto">Elimină fotografia</button></div>'; $('clearPhoto').onclick=()=>{v.innerHTML='';$('photoFile').value=''}}
 };
 r.onerror=()=>alert('Fotografia nu a putut fi citită.');
 r.readAsDataURL(file);
}

async function analyzeCasePhotoAI(c){
 if(!c || !c.photo){alert('Atașează mai întâi o fotografie.');return;}
 if(location.protocol==='file:' || location.protocol==='content:'){
  alert('Analiza AI necesită rularea aplicației pe un server configurat. În modul local, fotografia rămâne pe telefon și nu este transmisă.');return;
 }
 if(!confirm('Fotografia va fi transmisă serviciului AI pentru analiză. Continuăm?'))return;
 const btn=document.getElementById('analyzeCasePhoto');if(btn){btn.disabled=true;btn.textContent='Se analizează...';}
 try{
  const res=await fetch('/api/analyze-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:c.photo,context:c.title,caseId:c.id})});
  let data;try{data=await res.json()}catch(_){throw Error('Răspuns invalid de la server.');}
  if(!res.ok)throw Error(data.error||'Serviciul AI nu este disponibil.');
  if(typeof data.analysis!=='string'||!data.analysis.trim())throw Error('Analiza nu a returnat un rezultat.');
  c.photoAnalysis={text:data.analysis.slice(0,6000),created:new Date().toISOString(),source:'AI - neconfirmat'};
  save();render();
 }catch(e){alert('Analiza nu a putut fi efectuată: '+e.message);if(btn){btn.disabled=false;btn.textContent='ANALIZEAZĂ FOTOGRAFIA';}}
}
function newGuideHTML(c){
 const fridge=c.kind==='fridge', subject=fridge?'Frigiderul nu răcește':'Ușa nu se închide';
 if(c.step==='newSafety')return `<span class="status">VERIFICARE DE SIGURANȚĂ</span><h2>${subject}</h2><p>${fridge?'Există fum, miros de ars, scântei, cabluri deteriorate sau apă lângă priză?':'Există o persoană blocată, un risc de accidentare sau o ușă de evacuare care nu poate fi folosită?'}</p><div class="note">${fridge?'Nu atinge cabluri sau prize deteriorate și nu desface carcasa aparatului.':'Nu forța ușa, balamalele sau încuietoarea. Dacă este o urgență, cere ajutor imediat.'}</div><div class="actions" style="margin-top:12px"><button class="action alt" data-new="danger">Da / Nu știu</button><button class="action" data-new="safe">Nu, este sigur</button></div>`;
 if(c.step==='newDanger')return `<span class="status danger">OPREȘTE VERIFICAREA</span><h2>Este necesar ajutor calificat</h2><p>${fridge?'Dacă observi fum sau scântei, îndepărtează-te și nu atinge aparatul sau instalația electrică.':'Nu forța accesul și nu bloca ieșirile. Pentru persoane în pericol, solicită imediat ajutor.'}</p><p>În caz de pericol imediat, apelează 112.</p><button class="action red" id="newEmergency">Ajutor urgent / 112</button><button class="action alt" id="newFinish">Salvează cazul</button>`;
 if(c.step==='newCheck')return `<span class="status">OBSERVAȚIE FĂRĂ DEMONTARE</span><h2>${subject}</h2><p>${fridge?'Verifică doar vizual dacă ușa frigiderului se închide complet și dacă există un spațiu liber pentru ventilație. Nu atinge conexiuni electrice.':'Verifică vizual dacă un obiect împiedică închiderea ușii sau dacă aceasta pare deplasată. Nu demonta balamale ori încuietori.'}</p><p>Ai observat o cauză evidentă, care poate fi îndepărtată fără forță și fără unelte?</p><div class="actions"><button class="action" data-new="simple">Da</button><button class="action alt" data-new="unclear">Nu / Nu știu</button><button class="action alt" data-new="specialist">Solicită specialist</button></div>`;
 if(c.step==='newVerify')return `<span class="status">VERIFICAREA REZULTATULUI</span><h2>Verificare finală</h2><p>${fridge?'După închiderea corectă a ușii, răcirea poate necesita timp. Nu declara problema rezolvată fără confirmarea temperaturii adecvate cu un termometru; alimentele perisabile care au stat prea calde pot fi nesigure.':'După îndepărtarea obstacolului, ușa se închide normal, fără forțare?'}</p><div class="actions"><button class="action" data-new="fixed">${fridge?'Temperatura este confirmată':'Da, se închide normal'}</button><button class="action alt" data-new="unverified">Nu / Nu am verificat</button><button class="action alt" data-new="specialist">Necesită specialist</button></div>`;
 return `<span class="status">${esc(statusRO[c.status]||'Neverificată')}</span><h2>Rezultatul</h2><p>${c.status==='RESOLVED'?'Rezultatul a fost confirmat de utilizator.':c.status==='ESCALATED'?'Verificarea a fost oprită. Este recomandat un specialist.':'Cauza sau remedierea nu sunt confirmate. Păstrează cazul pentru urmărire.'}</p><div class="actions"><button class="action alt" id="newRestart">Reia verificarea</button><button class="action" id="newSave">Caz salvat · Vezi istoricul</button></div><p class="muted">Ghid local orientativ. Nu s-a contactat automat niciun specialist.</p>`;
}
function newGuideAction(c,a){
 if(a==='danger'){c.step='newDanger';c.status='ESCALATED'}
 else if(a==='safe')c.step='newCheck';
 else if(a==='simple')c.step='newVerify';
 else if(a==='unclear'||a==='unverified'){c.step='newResult';c.status='UNDETERMINED'}
 else if(a==='specialist'){c.step='newResult';c.status='ESCALATED'}
 else if(a==='fixed'){c.step='newResult';c.status='RESOLVED'}
 save();render();
}

nalyzeCasePhoto">ANALIZEAZĂ FOTOGRAFIA</button></div><p class="muted">Analiza AI necesită serverul configurat. La apăsarea butonului, fotografia va fi trimisă către serviciul AI numai cu acordul tău.</p>${c.photoAnalysis?`<div class="note" style="margin-top:12px;white-space:pre-wrap"><b>Analiză AI orientativă (neconfirmată)</b><p>${esc(c.photoAnalysis.text)}</p></div>`:``}</div>`:``}`;else if(c.step==='causeInfo')b=`<span class="status">CAUZĂ POSIBILĂ · NECONFIRMATĂ</span><h2>${c.cause==='Racord'?'Posibilă scurgere la racord':'Posibilă scurgere la sifon'}</h2><p>${c.cause==='Racord'?'Un racord este o conexiune între conducte sau furtunuri.':'Sifonul este componenta de evacuare de sub chiuvetă.'} Observația vizuală nu confirmă cauza.</p><div class="note">Nu demonta, nu strânge și nu forța componentele dacă există pericole, dacă nu ai experiență sau dacă apa poate ajunge la electricitate. Păstrează alimentarea cu apă oprită, dacă a fost oprită în siguranță.</div><div class="actions" style="margin-top:12px"><button class="action" id="causeResult">Salvează observația</button><button class="action alt" id="causeSpecialist">Solicită specialist</button><button class="action alt" id="causeBack">Reverifică sursa</button></div>`;else b=`<span class="status">${statusRO[c.status]||c.status}</span><h2>Rezultatul</h2><p>${c.status==='RESOLVED'?'Remedierea a fost confirmată de utilizator.':' '+(c.status==='CONTAINED'?'Scurgerea imediată a fost limitată conform confirmării tale. Cauza nu este încă declarată remediată.' :c.status==='ESCALATED'?'Procedura a fost oprită pentru siguranță. Solicită ajutor calificat; dacă există pericol imediat, sună la 112.':'Problema nu este confirmată ca rezolvată.')}</p>`;

const chooseCasePhoto=()=>{
 const overlay=document.createElement('div');overlay.id='photoChoice';overlay.style.cssText='position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:16px';
 overlay.innerHTML='<div role="dialog" aria-label="Adaugă fotografie" style="width:min(100%,460px);background:white;border-radius:22px;padding:22px;display:grid;gap:12px"><h3 style="margin:0">Adaugă fotografia problemei</h3><button class="action" id="takeCasePhoto">📷 FĂ FOTOGRAFIE</button><button class="action alt" id="galleryCasePhoto">🖼 ALEGE DIN GALERIE</button><button class="action alt" id="cancelCasePhoto">Anulează</button><p class="muted" style="margin:0">Fotografia este păstrată local în cazul tău. Nu este analizată automat.</p></div>';
 document.body.appendChild(overlay);
 const close=()=>overlay.remove();
 const pick=(camera)=>{close();const picker=document.createElement('input');picker.type='file';picker.accept='image/*';if(camera)picker.setAttribute('capture','environment');picker.onchange=()=>{const f=picker.files&&picker.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Selectează o fotografie validă.');return}if(f.size>8*1024*1024){alert('Alege o imagine sub 8 MB.');return;}const r=new FileReader();r.onerror=()=>alert('Fotografia nu a putut fi citită.');r.onload=()=>{const img=new Image();img.onerror=()=>alert('Imagine invalidă.');img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,1000/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);try{const previous=c.photo;c.photo=canvas.toDataURL('image/jpeg',0.62);if(!save()){if(previous===undefined)delete c.photo;else c.photo=previous;return;}render()}catch(e){alert('Nu s-a putut procesa fotografia.')}};img.src=r.result};r.readAsDataURL(f)};picker.click()};
 overlay.querySelector('#takeCasePhoto').onclick=()=>pick(true);overlay.querySelector('#galleryCasePhoto').onclick=()=>pick(false);overlay.querySelector('#cancelCasePhoto').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};
};

else if(st.screen==='caseDetail'&&c){
 const events=Array.isArray(c.events)?c.events:[];
 s.innerHTML=`<button class="back" id="detailBack">← Istoric</button><div class="card"><span class="status">${esc(statusRO[c.status]||'Neverificată')}</span><h2>${esc(c.title)}</h2><p class="muted">Creat: ${esc(c.created)} · ID: ${esc(c.id)}</p><p><b>Observații</b></p><textarea class="field" id="caseNotes" rows="5" maxlength="4000" placeholder="Notează observațiile și intervențiile...">${esc(c.notes||'')}</textarea><label for="caseState">Starea cazului</label><select class="field" id="caseState">${[['UNDETERMINED','Neverificată'],['CONTAINED','Scurgere limitată'],['PARTIAL','Nerezolvată'],['ESCALATED','Necesită specialist'],['RESOLVED','Remediată']].map(([v,t])=>`<option value="${v}" ${c.status===v?'selected':''}>${t}</option>`).join('')}</select><p class="muted">Marchează „Remediată” numai după verificarea efectivă a rezultatului.</p><div class="actions"><button class="action" id="saveDetail">Salvează modificările</button><button class="action alt" id="resumeDetail">Reia verificarea</button></div></div><div class="card"><h3>Fotografiile cazului (${casePhotos(c).length}/9)</h3>${casePhotos(c).length?casePhotos(c).map((photo,i)=>`<div style="margin:12px 0;padding:10px;border:1px solid #dde5df;border-radius:14px"><img src="${photo}" alt="Fotografia ${i+1}" style="display:block;width:100%;max-height:360px;object-fit:contain;border-radius:12px"><button class="action alt" style="margin-top:10px" data-remove-photo="${i}">Elimină fotografia ${i+1}</button></div>`).join(''):'<p class="muted">Nu există fotografii atașate.</p>'}<input type="file" id="detailPhoto" accept="image/jpeg,image/png,image/webp" multiple class="field"><p class="muted">Poți adăuga fotografii noi, maximum 9 în total. Fotografiile existente nu sunt înlocuite automat.</p></div><div class="card"><h3>Jurnalul modificărilor</h3>${events.length?events.slice().reverse().map(e=>`<p><b>${esc(e.date)}</b> — ${esc(e.text)}</p>`).join(''):'<p class="muted">Nu există încă modificări înregistrate în jurnal.</p>'}</div>`;
 $('detailBack').onclick=()=>go('history');$('resumeDetail').onclick=()=>go('guide');
 $('saveDetail').onclick=()=>{const notes=$('caseNotes').value.trim(),status=$('caseState').value;const allowed=['UNDETERMINED','CONTAINED','PARTIAL','ESCALATED','RESOLVED'];if(!allowed.includes(status))return;if(status==='RESOLVED'&&c.status!=='RESOLVED'&&!confirm('Confirmi că remedierea a fost verificată efectiv?'))return;const changes=[];if(notes!==(c.notes||''))changes.push('Observații actualizate');if(status!==c.status)changes.push('Stare: '+(statusRO[c.status]||c.status)+' → '+statusRO[status]);if(!changes.length){alert('Nu există modificări de salvat.');return}const prev={notes:c.notes,status:c.status,events:c.events};c.notes=notes;c.status=status;c.events=[...events,{date:new Date().toLocaleString('ro-RO'),text:changes.join('; ')}];if(!save()){Object.assign(c,prev);return}alert('Modificările au fost salvate în același caz.');render()};
 async function processPhoto(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>8*1024*1024)throw Error('Imagine invalidă sau mai mare de 8 MB');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('Citire nereușită'));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(Error('Imagine deteriorată'));im.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.65))};im.src=reader.result};reader.readAsDataURL(file)});}
 $('detailPhoto').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;if(casePhotos(c).length+files.length>9){alert('Maximum 9 fotografii pe caz.');return}if(!confirm('Adaugi '+files.length+' fotografii în acest caz?'))return;try{const added=[];for(const f of files)added.push(await processPhoto(f));const oldPhotos=c.photos,oldEvents=c.events;c.photos=[...(c.photos||[]),...added];c.events=[...events,{date:new Date().toLocaleString('ro-RO'),text:'Au fost adăugate '+added.length+' fotografii'}];if(!save()){c.photos=oldPhotos;c.events=oldEvents;return}render()}catch(err){alert('Fotografiile nu au fost adăugate: '+err.message)}};
 s.querySelectorAll('[data-remove-photo]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.removePhoto);if(!confirm('Elimini fotografia '+(i+1)+' din acest caz?'))return;const oldPhoto=c.photo,oldPhotos=c.photos,oldEvents=c.events;if(c.photo&&i===0){delete c.photo}else{const j=i-(c.photo?1:0);c.photos=(c.photos||[]).filter((_,k)=>k!==j)}c.events=[...events,{date:new Date().toLocaleString('ro-RO'),text:'Fotografia '+(i+1)+' eliminată'}];if(!save()){if(oldPhoto===undefined)delete c.photo;else c.photo=oldPhoto;c.photos=oldPhotos;c.events=oldEvents;return}render()});
}

 const caseFilters=window.fhgHistoryFilters||{query:'',status:'ALL'};
 const filteredCases=st.cases.filter(x=>(x.title||'').toLocaleLowerCase('ro').includes(caseFilters.query.toLocaleLowerCase('ro'))&&(caseFilters.status==='ALL'||x.status===caseFilters.status));
 s.innerHTML=`<h2>Istoric cazuri</h2>
<div class="card"><b>Caută în istoricul cazurilor</b><p class="muted">Caută după titlu sau filtrează după stare. Datele nu sunt modificate.</p><label for="historySearch">Caută după titlu</label><input id="historySearch" class="field" type="search" placeholder="Ex. chiuvetă" aria-label="Caută după titlu"><label for="historyStatus">Filtrează după stare</label><select id="historyStatus" class="field" aria-label="Filtrează după stare"><option value="ALL">Toate stările</option><option value="CONTAINED">Scurgere limitată</option><option value="UNDETERMINED">Neverificată</option><option value="ESCALATED">Necesită specialist</option><option value="RESOLVED">Remediată</option></select><button class="action alt" id="resetHistoryFilters" type="button">Resetează filtrele</button><p class="muted" id="historyCount" aria-live="polite"></p></div>
<div id="historyCards">${st.cases.length?st.cases.map(x=>`<div class="card" data-case-card><b>${esc(x.title)}</b><div class="muted">${esc(x.created)} · ${esc(statusRO[x.status]||x.status)} · ${x.budget??'—'} lei</div><div class="actions"><button class="action" data-open="${esc(x.id)}">Vezi fișa cazului</button><button class="action alt" data-delete="${esc(x.id)}">Șterge</button></div></div>`).join(''):'<div class="card">Nu există cazuri salvate.</div>'}</div><p id="historyEmpty" class="muted" hidden>Nu există cazuri care corespund filtrelor selectate.</p>
<details class="card"><summary style="cursor:pointer;font-weight:700">Backup, restaurare și migrare</summary><p class="muted">Exportă backup înainte de a schimba adresa aplicației. Fișierul primește automat data și ora. Păstrează-l într-un loc sigur și verifică toate fotografiile înainte de migrare.</p><div class="actions"><button class="action" id="exportCases">Exportă backup cu fotografii</button><label class="action alt" style="text-align:center;cursor:pointer">Importă backup<input id="importCases" type="file" accept=".json,application/json" style="display:none"></label></div><p class="muted" id="backupSummary"></p><p class="muted">Importul adaugă doar cazurile cu ID nou. Cazurile cu același ID, inclusiv fotografiile lor, rămân nemodificate. Pentru mutarea pe alt dispozitiv, importă backupul într-o instalare fără cazuri și verifică rezultatul înainte de a șterge originalul.</p><b>Test restaurare fără modificarea datelor</b><p class="muted">Acest test verifică structura și fotografiile din fișier, dar NU confirmă încă restaurarea pe un dispozitiv nou. Pentru verificarea completă, importă fișierul într-o instalare separată și compară numărul cazurilor, observațiile și imaginile.</p><p class="muted">Verifică fotografiile direct din fișier, fără import și fără ștergere.</p><label class="action alt" style="display:block;text-align:center;cursor:pointer">Verifică backup și fotografii<input id="restoreCheckFile" type="file" accept=".json,application/json" style="display:none"></label><div id="restoreCheckResult" aria-live="polite"></div></details>`;
 const searchInput=$('historySearch'),statusInput=$('historyStatus'),count=$('historyCount');
 searchInput.value=caseFilters.query;statusInput.value=caseFilters.status;
 const refreshHistory=()=>{const q=searchInput.value.trim().toLocaleLowerCase('ro'),status=statusInput.value;window.fhgHistoryFilters={query:searchInput.value,status};const cards=Array.from(document.querySelectorAll('[data-open]')).map(b=>b.closest('.card'));let visible=0;cards.forEach(card=>{const btn=card.querySelector('[data-open]'),item=st.cases.find(c=>c.id===btn.dataset.open);const match=item&&(item.title||'').toLocaleLowerCase('ro').includes(q)&&(status==='ALL'||item.status===status);card.hidden=!match;if(match)visible++;});count.textContent='Afișate '+visible+' din '+st.cases.length+' cazuri.';$('historyEmpty').hidden=visible!==0||st.cases.length===0;};
 searchInput.addEventListener('input',refreshHistory);statusInput.addEventListener('change',refreshHistory);$('resetHistoryFilters').onclick=()=>{searchInput.value='';statusInput.value='ALL';refreshHistory();};refreshHistory();
 document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{st.active=x.dataset.open;go('caseDetail')});

 $('backupSummary').textContent='În acest moment: '+st.cases.length+' cazuri, '+photoTotal(st.cases)+' fotografii atașate. Exportă și verifică fișierul înainte de migrare.';$('restoreCheckFile').onchange=e=>{verifyBackupReadOnly(e.target.files[0]);e.target.value=''};$('exportCases').onclick=exportCases;$('importCases').onchange=e=>{importCases(e.target.files[0]);e.target.value=''};

else if(st.screen==='reminders'){s.innerHTML=`<h2>Memento</h2><div class="card"><input class="field" id="rt" placeholder="Activitate"><input class="field" id="rd" type="datetime-local"><button class="action" id="ra">Salvează</button><p class="muted">Memento-ul este salvat local; notificările reale nu sunt încă active.</p></div>${st.reminders.map(r=>`<div class="card"><b>${esc(r.text)}</b><div class="muted">${new Date(r.date).toLocaleString('ro-RO')}</div></div>`).join('')}`;$('ra').onclick=()=>{let t=$('rt').value.trim(),d=$('rd').value;if(t&&d){st.reminders.push({text:t,date:d});if(!save()){st.reminders.pop();return;}render()}}}

else{s.innerHTML=`<h2>Profil</h2><div class="card"><b>FIRST HELP GUIDE V1.22</b><p class="muted">Datele sunt păstrate local în această instalare. Actualizarea pe aceeași adresă păstrează de regulă datele browserului, dacă acestea nu sunt șterse. Exportă și verifică un backup JSON înainte de fiecare actualizare. Nu șterge datele până când restaurarea pe altă instalare nu este confirmată.</p><button class="action red" id="clear">Șterge datele locale</button></div>`;$('clear').onclick=()=>{if(confirm('Ștergi definitiv toate cazurile, fotografiile și mementourile de pe acest dispozitiv? Asigură-te că ai exportat și verificat un backup.')){try{localStorage.removeItem(KEY);if(localStorage.getItem(KEY)!==null)throw Error('Ștergerea nu a fost confirmată');st={screen:'home',cases:[],active:null,reminders:[]};render()}catch(e){alert('Ștergerea nu a fost confirmată: '+e.message)}}}}}
